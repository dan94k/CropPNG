name: croppng
services:
  croppng:
    image: nginx:stable-alpine
    container_name: croppng
    restart: unless-stopped
    ports:
      - target: 8080
        published: "4173"
        protocol: tcp
    security_opt:
      - no-new-privileges:true
    volumes:
      - /DATA/AppData/croppng/source/dist:/usr/share/nginx/html:ro
      - /DATA/AppData/croppng/source/nginx.conf:/etc/nginx/nginx.conf:ro
x-casaos:
  id: local.dan.croppng
  main: croppng
  title:
    en_US: CropPNG
    pt_BR: CropPNG
  tagline:
    en_US: Crop and export game assets
    pt_BR: Recorte e exporte assets de jogos
  description:
    en_US: Select sprites, refine outlines and download individual PNGs or a ZIP archive. Images are processed in your browser.
    pt_BR: Selecione sprites, ajuste contornos e baixe PNGs individuais ou um ZIP. As imagens são processadas no navegador.
  icon: http://192.168.1.170:4173/icon.svg
  scheme: http
  hostname: ""
  port_map: "4173"
  index: /
  category: Productivity
  developer: dan
  author: dan
  architectures:
    - amd64
    - arm64
  version: "1.0.1"
